name: Deploy

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: "7-character image SHA to deploy (use an older one to roll back)"
        type: string
        required: true
      break_health:
        description: "Simulate a broken /health endpoint"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      BREAK_HEALTH: ${{ inputs.break_health && '1' || '0' }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SG_ID: ${{ secrets.EC2_SG_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
    steps:
      - uses: actions/checkout@v4

      - name: Validate image tag
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "image_tag must be 7 lowercase hex characters, got: '$IMAGE_TAG'"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Allow this runner's IP on port 22
        run: |
          CALLER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "CALLER_IP=$CALLER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SG_ID" --protocol tcp --port 22 --cidr "${CALLER_IP}/32" \
            || echo "Rule may already exist, continuing"

      - name: Wait for SSH
        run: |
          ansible all -i "${EC2_HOST}," -u ubuntu --private-key ~/.ssh/deploy_key \
            -m ansible.builtin.wait_for_connection -a "timeout=90"

      - name: Deploy with Ansible
        working-directory: ansible
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          export IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flask-app"
          ansible-playbook -i "${EC2_HOST}," -u ubuntu \
            --private-key ~/.ssh/deploy_key deploy.yml

      - name: Close port 22 again
        if: always()
        run: |
          if [ -n "$CALLER_IP" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "$EC2_SG_ID" --protocol tcp --port 22 --cidr "${CALLER_IP}/32" || true
          fi
